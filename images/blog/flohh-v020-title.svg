      <path d="M3 5 v-2 a2.5 2.5 0 0 1 5 0 v2" fill="none" stroke="#C4441D" stroke-width="1.4"/>
    </g>
    <text x="563" y="210" font-size="11" fill="#5E5A53">Verbunden mit BUERO-PC (Windows). Die Verbindung ist verschlüsselt.</text>

    <!-- Karte: Ordner mit Fortschritt -->
    <rect x="548" y="224" width="554" height="214" rx="14" fill="#FFFFFF" stroke="#E2DCD0" stroke-width="1.5"/>
    <text x="566" y="248" font-size="11" font-weight="700" fill="#1F1D1A">Der alte Rechner gibt diese Ordner frei:</text>

    <!-- Dokumente: fertig -->
    <g transform="translate(566,260)">
      <text x="0" y="13" font-size="12" font-weight="700" fill="#1F1D1A">Dokumente</text>
      <text x="518" y="13" font-size="10" fill="#5E5A53" text-anchor="end">1.284 Dateien ✓</text>
      <text x="0" y="27" font-size="9" fill="#5E5A53">kommt nach C:\Users\Nicoletta\Documents</text>
      <rect x="0" y="33" width="518" height="5" rx="2.5" fill="#EFEAE0"/>
      <rect x="0" y="33" width="518" height="5" rx="2.5" fill="#E2552B"/>
    </g>
    <!-- Bilder: läuft -->
    <g transform="translate(566,304)">
      <text x="0" y="13" font-size="12" font-weight="700" fill="#1F1D1A">Bilder</text>
      <text x="518" y="13" font-size="10" fill="#C4441D" font-weight="700" text-anchor="end">5.703 / 8.912 Dateien</text>
      <text x="0" y="27" font-size="9" fill="#5E5A53">kommt nach C:\Users\Nicoletta\Pictures</text>
      <rect x="0" y="33" width="518" height="5" rx="2.5" fill="#EFEAE0"/>
      <rect x="0" y="33" width="332" height="5" rx="2.5" fill="#E2552B"/>
    </g>
