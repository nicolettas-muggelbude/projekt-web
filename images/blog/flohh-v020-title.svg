    <path d="M362 196 Q450 50 520 122" fill="none" stroke="#E2552B" stroke-width="2.5" stroke-dasharray="2 9" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Rechte Spalte: stilisiertes App-Fenster -->
  <rect x="532" y="92" width="610" height="470" rx="12" fill="#000000" opacity="0.10"/>
  <g clip-path="url(#winclip)" font-family="DM Sans, Arial, sans-serif">
