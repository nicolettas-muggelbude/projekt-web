    <text x="492" y="494" font-size="12" font-weight="700" fill="#1F1D1A">neu in v0.2.0</text>
    <text x="464" y="520" font-size="20" font-weight="700" fill="#C4441D">Windows ↔ Windows</text>
    <text x="464" y="543" font-size="13" fill="#3D3934">per LAN, WLAN oder Kabel</text>
    <text x="464" y="561" font-size="10" fill="#5E5A53">Verbinden jetzt auch per Adresse</text>
