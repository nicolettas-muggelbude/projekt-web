    <text x="168" y="137" font-size="12" font-weight="700" letter-spacing="1.5" fill="#C4441D" text-anchor="middle">NEU · RELEASE 0.2.0</text>

    <use href="#flohh-mark" x="64" y="168" width="104" height="92"/>
    <text x="178" y="236" font-size="60" font-weight="700" fill="#1F1D1A">flohh</text>

    <text x="68" y="306" font-size="27" font-weight="600" fill="#3D3934">Daten springen von</text>
    <text x="68" y="340" font-size="27" font-weight="600" fill="#3D3934">Rechner zu Rechner</text>

    <text x="68" y="388" font-size="15" fill="#5E5A53">Windows · Linux · macOS</text>
    <text x="68" y="410" font-size="15" fill="#5E5A53">ohne Installation, ohne Cloud, ohne Konto</text>

