      <text x="0" y="13" font-size="12" font-weight="700" fill="#1F1D1A">Musik</text>
      <text x="518" y="13" font-size="10" fill="#5E5A53" text-anchor="end">2.140 Dateien</text>
      <text x="0" y="27" font-size="9" fill="#5E5A53">kommt nach C:\Users\Nicoletta\Music</text>
      <rect x="0" y="33" width="518" height="5" rx="2.5" fill="#EFEAE0"/>
    </g>
    <!-- Schreibtisch: wartet -->
    <g transform="translate(566,392)">
      <text x="0" y="13" font-size="12" font-weight="700" fill="#1F1D1A">Schreibtisch</text>
      <text x="518" y="13" font-size="10" fill="#5E5A53" text-anchor="end">87 Dateien</text>
      <text x="0" y="27" font-size="9" fill="#5E5A53">kommt nach C:\Users\Nicoletta\Desktop</text>
      <rect x="0" y="33" width="518" height="5" rx="2.5" fill="#EFEAE0"/>
    </g>

    <!-- Status und Knopf -->
    <text x="736" y="488" font-size="11" fill="#5E5A53">108 MB/s · noch ca. 4 Minuten</text>
    <rect x="990" y="470" width="112" height="30" rx="10" fill="#FFFFFF" stroke="#E2DCD0" stroke-width="1.5"/>
    <text x="1046" y="489" font-size="11" font-weight="700" fill="#1F1D1A" text-anchor="middle">Anhalten</text>
