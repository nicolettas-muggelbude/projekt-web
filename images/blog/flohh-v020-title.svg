    <!-- Titelleiste -->
    <rect x="520" y="80" width="610" height="30" fill="#1F1D1A"/>
    <text x="825" y="100" font-size="12" font-weight="600" fill="#F6F3EC" text-anchor="middle">flohh v0.2.0</text>
    <g stroke="rgba(246,243,236,0.8)" stroke-width="1.3" fill="none">
      <path d="M1070 95 h9"/>
      <rect x="1093" y="90" width="9" height="9"/>
      <path d="M1113 90 l9 9 M1122 90 l-9 9"/>
    </g>

    <!-- App-Kopf -->
    <use href="#flohh-mark" x="548" y="124" width="38" height="34"/>
    <text x="592" y="150" font-size="22" font-weight="700" fill="#1F1D1A">flohh</text>
    <text x="1102" y="148" font-size="10" fill="#5E5A53" text-anchor="end">Daten springen von Rechner zu Rechner</text>

    <text x="548" y="190" font-size="17" font-weight="700" fill="#1F1D1A">Verbunden – neuer Rechner</text>
    <g transform="translate(548,199)">
