  <!-- Floating Chip: Neu in v0.2.0 -->
  <rect x="452" y="470" width="262" height="108" rx="12" fill="#000000" opacity="0.10"/>
  <rect x="446" y="464" width="262" height="108" rx="12" fill="#FFFFFF" stroke="#E2DCD0"/>
  <g font-family="DM Sans, Arial, sans-serif">
