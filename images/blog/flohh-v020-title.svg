<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="flohh 0.2.0 – Daten springen von Rechner zu Rechner, jetzt auch von Windows zu Windows">
