<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Kater 1.4.0 – App-Fenster mit geöffnetem Dubletten-Menü und CSV-Export">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eef2f6"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2c5f8a"/>
      <stop offset="100%" stop-color="#24506f"/>
    </linearGradient>
    <clipPath id="winclip"><rect x="520" y="70" width="610" height="470" rx="12"/></clipPath>
  </defs>

  <!-- Hintergrund im App-Grau, dezenter Blauton statt Website-Lila -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <circle cx="1180" cy="40" r="170" fill="#2c5f8a" opacity="0.05"/>
  <circle cx="40" cy="600" r="130" fill="#8A2BE2" opacity="0.04"/>

  <!-- Linke Spalte: Titeltext -->
  <g font-family="Arial, sans-serif">
    <rect x="70" y="150" width="150" height="26" rx="13" fill="#e3edf5"/>
    <text x="145" y="167" font-size="12" font-weight="700" letter-spacing="1.5" fill="#2c5f8a" text-anchor="middle">RELEASE 1.4.0</text>

    <text x="68" y="248" font-size="56" font-weight="700" fill="#1f2937">Kater <tspan fill="#2c5f8a">1.4.0</tspan></text>
    <text x="68" y="300" font-size="26" font-weight="600" fill="#374151">Dubletten-Erkennung</text>
    <text x="68" y="334" font-size="26" font-weight="600" fill="#374151">&amp; CSV-Export nach</text>
    <text x="68" y="368" font-size="26" font-weight="600" fill="#374151">eigenen Regeln</text>

    <circle cx="82" cy="430" r="14" fill="#2c5f8a"/>
    <text x="82" y="435" font-size="14" text-anchor="middle" fill="white">🐾</text>
    <text x="106" y="435" font-size="15" fill="#6b7280">Linux-Adressbuch · kater-adressen.app</text>
  </g>

  <!-- Rechte Spalte: stilisiertes App-Fenster -->
  <rect x="532" y="82" width="610" height="470" rx="12" fill="#000000" opacity="0.12"/>
  <g clip-path="url(#winclip)">
    <rect x="520" y="70" width="610" height="470" fill="#ffffff"/>

    <!-- Titelleiste -->
    <rect x="520" y="70" width="610" height="32" fill="#1c1c1c"/>
    <text x="825" y="91" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="white" text-anchor="middle">Kater v1.4.0</text>
    <g stroke="rgba(255,255,255,0.8)" stroke-width="1.4" fill="none">
      <path d="M1078 86 h10"/>
      <rect x="1103" y="80" width="10" height="10"/>
      <path d="M1128 80 l10 10 M1138 80 l-10 10"/>
    </g>

    <!-- Menüleiste -->
    <rect x="520" y="102" width="610" height="26" fill="#f0f0f0"/>
    <g font-family="Arial, sans-serif" font-size="12" fill="#3a3a3a">
      <text x="534" y="119">Datei</text>
      <text x="580" y="119">Export</text>
      <text x="633" y="119" font-weight="700" fill="#2c5f8a">Extras</text>
      <text x="683" y="119">Bearbeiten</text>
      <text x="752" y="119">Hilfe</text>
    </g>

    <!-- Geöffnetes Extras-Menü: Dubletten finden -->
    <rect x="620" y="130" width="196" height="58" rx="4" fill="#ffffff" stroke="#cfd4d9"/>
    <text x="632" y="150" font-family="Arial, sans-serif" font-size="11" fill="#555555">Gruppen aktivieren</text>
    <rect x="622" y="156" width="192" height="22" fill="#e8f1f8"/>
    <circle cx="634" cy="167" r="4" fill="none" stroke="#2c5f8a" stroke-width="1.3"/>
    <circle cx="640" cy="167" r="4" fill="none" stroke="#2c5f8a" stroke-width="1.3"/>
    <text x="650" y="171" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#1c4f74">Dubletten finden...</text>

    <!-- Header-Banner mit Maskottchen -->
    <rect x="520" y="188" width="610" height="52" fill="url(#headerGrad)"/>
    <circle cx="552" cy="214" r="15" fill="#6fa8cf"/>
    <path d="M545 207 l4 -6 l3 5 z M559 207 l-4 -6 l-3 5 z" fill="#6fa8cf"/>
    <circle cx="547" cy="214" r="1.6" fill="#1c1c1c"/>
    <circle cx="557" cy="214" r="1.6" fill="#1c1c1c"/>
    <path d="M549 219 q3 3 6 0" stroke="#1c1c1c" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <text x="580" y="221" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="white">Kater – v1.4.0</text>

    <!-- Seitenleiste -->
    <rect x="520" y="240" width="160" height="300" fill="#fbfbfc"/>
    <text x="532" y="259" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">Gruppe:</text>
    <rect x="532" y="264" width="120" height="18" fill="white" stroke="#cfd4d9"/>
    <text x="538" y="277" font-family="Arial, sans-serif" font-size="10" fill="#333">Alle Kontakte</text>
    <rect x="532" y="292" width="136" height="20" fill="white" stroke="#cfd4d9"/>
    <text x="538" y="306" font-family="Arial, sans-serif" font-size="10" fill="#9aa0a6">Suche</text>

    <rect x="520" y="322" width="160" height="22" fill="#2c5f8a"/>
    <text x="534" y="337" font-family="Arial, sans-serif" font-size="11" fill="white">Online GmbH</text>
    <text x="534" y="360" font-family="Arial, sans-serif" font-size="11" fill="#4b5563">Josie</text>
    <text x="534" y="382" font-family="Arial, sans-serif" font-size="11" fill="#4b5563">Philipp Hase</text>
    <text x="534" y="404" font-family="Arial, sans-serif" font-size="11" fill="#4b5563">Lisa Lotte</text>

    <circle cx="670" cy="322" r="11" fill="#22c55e"/>
    <path d="M664 322 l4 4 l8 -8" stroke="white" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="532" y="522" font-family="Arial, sans-serif" font-size="9" fill="#9aa0a6">4 Kontakte</text>
    <rect x="524" y="528" width="112" height="20" fill="#eeeeee" stroke="#c9cdd2"/>
    <text x="580" y="542" font-family="Arial, sans-serif" font-size="9" fill="#333" text-anchor="middle">+ Neuer Kontakt</text>
    <rect x="642" y="528" width="34" height="20" fill="#eeeeee" stroke="#c9cdd2"/>
    <text x="659" y="542" font-family="Arial, sans-serif" font-size="9" fill="#333" text-anchor="middle">QR</text>

    <!-- Inhaltsbereich -->
    <g font-family="Arial, sans-serif" font-size="10" fill="#6b7280">
      <text x="692" y="253">Name</text>
      <text x="732" y="253">Kontakt</text>
      <text x="785" y="253">Adressen</text>
      <text x="838" y="253" font-weight="700" fill="#2c5f8a">Organisation</text>
      <text x="915" y="253">Persönlich</text>
      <text x="978" y="253">Notiz</text>
    </g>
    <rect x="836" y="259" width="80" height="2" fill="#2c5f8a"/>

    <g font-family="Arial, sans-serif" font-size="10">
      <text x="800" y="294" fill="#6b7280" text-anchor="end">Firma:</text>
      <rect x="810" y="284" width="280" height="16" fill="white" stroke="#cfd4d9"/>
      <text x="818" y="296" fill="#333">Online GmbH</text>

      <text x="800" y="324" fill="#6b7280" text-anchor="end">Abteilung:</text>
      <rect x="810" y="314" width="280" height="16" fill="white" stroke="#cfd4d9"/>

      <text x="800" y="354" fill="#6b7280" text-anchor="end">Berufsbezeichnung:</text>
      <rect x="810" y="344" width="280" height="16" fill="white" stroke="#cfd4d9"/>

      <text x="800" y="384" fill="#6b7280" text-anchor="end">Funktion:</text>
      <rect x="810" y="374" width="280" height="16" fill="white" stroke="#cfd4d9"/>
    </g>

    <rect x="928" y="518" width="88" height="22" fill="#eeeeee" stroke="#c9cdd2"/>
    <text x="972" y="532" font-family="Arial, sans-serif" font-size="10" fill="#333" text-anchor="middle">Zurücksetzen</text>
    <rect x="1024" y="518" width="80" height="22" fill="#2c5f8a"/>
    <text x="1064" y="532" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="white" text-anchor="middle">Speichern</text>
  </g>

  <!-- Floating CSV-Export-Chip -->
  <rect x="452" y="466" width="196" height="100" rx="10" fill="#000000" opacity="0.10"/>
  <rect x="446" y="460" width="196" height="100" rx="10" fill="white" stroke="#d7dce1"/>
  <text x="464" y="485" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1c4f74">CSV-Export</text>
  <g font-family="Arial, sans-serif" font-size="9" fill="#4b5563">
    <rect x="464" y="495" width="160" height="14" rx="3" fill="#f2f4f6"/>
    <text x="470" y="505">Name, Telefon, E-Mail</text>
    <path d="M614 497 l4 -4 l4 4 M614 508 l4 4 l4 -4" stroke="#8a9099" stroke-width="1.2" fill="none"/>
  </g>
  <rect x="464" y="518" width="64" height="24" rx="12" fill="#2c5f8a"/>
  <text x="496" y="534" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">;</text>
  <rect x="536" y="518" width="64" height="24" rx="12" fill="#f2f4f6" stroke="#d7dce1"/>
  <text x="568" y="534" font-family="Arial, sans-serif" font-size="12" fill="#4b5563" text-anchor="middle">,</text>
</svg>
