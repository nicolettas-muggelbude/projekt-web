  <text x="464" y="518" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#4F46E5">47 Bugfixes</text>
  <text x="464" y="541" font-family="Arial, sans-serif" font-size="13" fill="#475569">12 Verbesserungen</text>
  <text x="464" y="560" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">in 15 Zwischenversionen</text>
