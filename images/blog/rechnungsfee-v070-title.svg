      <path d="M11 17 l3 3 l6 -7" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="32" y="21" font-family="Arial, sans-serif" font-size="10" fill="#334155">Abschlag 1 · AB-260012</text>
      <text x="372" y="21" font-family="Arial, sans-serif" font-size="10" fill="#475569" text-anchor="end">650,00 €</text>
