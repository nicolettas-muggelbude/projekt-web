      <rect x="8" y="10" width="14" height="14" rx="3" fill="#4F46E5"/>
      <path d="M11 17 l3 3 l6 -7" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="32" y="21" font-family="Arial, sans-serif" font-size="10" fill="#334155">Abschlag 2 · AB-260031</text>
      <text x="372" y="21" font-family="Arial, sans-serif" font-size="10" fill="#475569" text-anchor="end">500,00 €</text>
    </g>

    <rect x="718" y="290" width="380" height="2" fill="#e2e8f0"/>
    <text x="718" y="309" font-family="Arial, sans-serif" font-size="10" fill="#64748B">Gesamtleistung 2.300,00 €  −  1.150,00 € bereits gezahlt</text>

    <rect x="704" y="334" width="408" height="40" rx="8" fill="#EEF2FF"/>
    <text x="718" y="359" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#3730A3">Restbetrag: 1.150,00 €</text>

