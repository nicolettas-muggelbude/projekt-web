    </linearGradient>
    <clipPath id="winclip"><rect x="520" y="80" width="610" height="470" rx="12"/></clipPath>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <circle cx="1180" cy="40" r="170" fill="#4F46E5" opacity="0.05"/>
  <circle cx="30" cy="600" r="140" fill="#FFA000" opacity="0.05"/>

  <!-- Linke Spalte: Titeltext -->
