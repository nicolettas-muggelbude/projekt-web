    <text x="68" y="225" font-size="44" font-weight="700" fill="#1E293B">Rechnungs<tspan fill="#4F46E5">Fee</tspan></text>

    <text x="68" y="282" font-size="25" font-weight="600" fill="#334155">Abschlagsrechnungen &amp;</text>
    <text x="68" y="314" font-size="25" font-weight="600" fill="#334155">automatische</text>
    <text x="68" y="346" font-size="25" font-weight="600" fill="#334155">Schlussrechnung</text>

    <g transform="translate(68,392)">
